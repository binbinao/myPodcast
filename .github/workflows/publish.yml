name: publish site

on:
  push:
    branches: [main]
    paths:
      - "output/**"
      - "drafts/**"
      - "src/**"
      - "config.yaml"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉所有历史，build.py 可能读 git log

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Render index + feed (use existing mp3, no TTS)
        # CI 走 --skip-audio 模式：mp3 资产随 git 走（output/ 入 git）；
        # 仅重新渲染 shownotes / RSS / index.html。
        env:
          # 不设 MINIMAX_API_KEY：edge-tts backend 不需要 key
          TTS_BACKEND: edge-tts
        run: |
          python -m src.build drafts/ --skip-audio --log-level INFO || \
            python -m src.build drafts/*/ --skip-audio --log-level INFO

      - name: Deploy output/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com