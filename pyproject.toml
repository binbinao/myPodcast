[project]
name = "mypodcast"
version = "0.3.0"
description = "文章转语音播客流水线：raw → prepare → drafts → build → output/RSS"
requires-python = ">=3.13"
dependencies = [
    "edge-tts>=1.1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "pypinyin>=0.51",
]

[project.scripts]
mypodcast-prepare = "src.prepare:main"
mypodcast-build = "src.build:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# 只打包 src（可 import 的库）。scripts/ 是工具目录、无 __init__.py，不是包；
# 原先的 `include = ["src*", "scripts*"]` 是无效声明（find_packages 找不到无
# __init__.py 的目录），留着只会让人误以为 scripts/ 参与分发。
include = ["src*"]